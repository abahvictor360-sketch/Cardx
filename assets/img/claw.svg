<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 980" role="img" aria-label="A chrome robotic claw holding a black Cardx card">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e5e5e"/>
      <stop offset=".16" stop-color="#f4f4f4"/>
      <stop offset=".34" stop-color="#9c9c9c"/>
      <stop offset=".52" stop-color="#ffffff"/>
      <stop offset=".72" stop-color="#6f6f6f"/>
      <stop offset=".88" stop-color="#dcdcdc"/>
      <stop offset="1" stop-color="#4f4f4f"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#a5a5a5"/>
      <stop offset=".7" stop-color="#e9e9e9"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </linearGradient>
    <linearGradient id="armL" gradientUnits="userSpaceOnUse" x1="80" y1="560" x2="200" y2="640">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#9a9a9a"/>
      <stop offset=".65" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#555"/>
    </linearGradient>
    <linearGradient id="armR" gradientUnits="userSpaceOnUse" x1="560" y1="560" x2="440" y2="640">
      <stop offset="0" stop-color="#5c5c5c"/>
      <stop offset=".35" stop-color="#e6e6e6"/>
      <stop offset=".65" stop-color="#8f8f8f"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3b3b"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset=".5" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#333"/>
      <stop offset=".55" stop-color="#151515"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="1" stop-color="#8f8f8f"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="150" y="630" width="380" height="250" rx="14"/></clipPath>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .bob { animation: bob 6s ease-in-out infinite; transform-origin: 320px 0; }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(14px) } }
      @media (prefers-reduced-motion: reduce) { .bob { animation: none } }
    </style>
  </defs>

  <g class="bob" filter="url(#shadow)">
    <!-- top rod & mount -->
    <rect x="298" y="-40" width="44" height="82" fill="url(#metal)"/>
    <rect x="150" y="40" width="340" height="28" rx="8" fill="url(#metal)"/>
    <rect x="116" y="70" width="28" height="62" rx="6" fill="url(#metal)"/>
    <rect x="496" y="70" width="28" height="62" rx="6" fill="url(#metal)"/>
    <rect x="136" y="66" width="368" height="72" rx="10" fill="url(#metal)"/>
    <rect x="136" y="94" width="368" height="14" fill="#141414"/>
    <rect x="200" y="70" width="80" height="64" rx="10" fill="url(#panel)" stroke="#bdbdbd" stroke-width="3"/>
    <rect x="360" y="70" width="80" height="64" rx="10" fill="url(#panel)" stroke="#bdbdbd" stroke-width="3"/>
    <circle cx="240" cy="102" r="20" fill="#151515" stroke="url(#metal)" stroke-width="6"/>
    <circle cx="400" cy="102" r="20" fill="#151515" stroke="url(#metal)" stroke-width="6"/>
    <rect x="156" y="138" width="328" height="24" rx="8" fill="url(#metal)"/>
    <circle cx="186" cy="150" r="4" fill="#333"/><circle cx="454" cy="150" r="4" fill="#333"/>

    <!-- neck -->
    <rect x="236" y="162" width="168" height="110" fill="url(#metal)"/>
    <rect x="236" y="196" width="168" height="4" fill="#7a7a7a" opacity=".6"/>
    <rect x="236" y="236" width="168" height="4" fill="#7a7a7a" opacity=".6"/>
    <rect x="222" y="268" width="196" height="44" rx="10" fill="url(#dark)"/>
    <rect x="300" y="312" width="40" height="18" fill="url(#metal)"/>

    <!-- shaft (behind card) -->
    <rect x="302" y="360" width="36" height="590" fill="url(#metal)"/>
    <rect x="292" y="560" width="56" height="34" rx="6" fill="#121212"/>
    <rect x="296" y="900" width="48" height="40" rx="6" fill="url(#metal)"/>

    <!-- card -->
    <g clip-path="url(#cardClip)">
      <rect x="150" y="630" width="380" height="250" rx="14" fill="url(#card)"/>
      <polygon points="330,880 430,690 486,690 386,880" fill="#8e8e8e"/>
      <polygon points="430,880 530,880 530,740 500,740" fill="#f25c1f"/>
      <rect x="150" y="630" width="380" height="1.5" fill="#ffffff" opacity=".25"/>
    </g>
    <g transform="translate(184 700)">
      <rect width="62" height="48" rx="8" fill="url(#chip)"/>
      <path d="M0 16h18M0 32h18M44 16h18M44 32h18M18 0v48M44 0v48M18 24h26" stroke="#6b6b6b" stroke-width="2" fill="none"/>
    </g>

    <!-- struts -->
    <g stroke-linecap="round">
      <line x1="244" y1="350" x2="128" y2="600" stroke="url(#metal)" stroke-width="16"/>
      <line x1="396" y1="350" x2="512" y2="600" stroke="url(#metal)" stroke-width="16"/>
      <line x1="160" y1="530" x2="134" y2="588" stroke="#111" stroke-width="26"/>
      <line x1="480" y1="530" x2="506" y2="588" stroke="#111" stroke-width="26"/>
    </g>

    <!-- hub -->
    <rect x="196" y="318" width="248" height="58" rx="29" fill="url(#dark)"/>
    <circle cx="262" cy="347" r="15" fill="url(#metal)" stroke="#0d0d0d" stroke-width="3"/>
    <circle cx="378" cy="347" r="15" fill="url(#metal)" stroke="#0d0d0d" stroke-width="3"/>

    <!-- upper arms -->
    <g stroke-linecap="round" fill="none">
      <path d="M298 500 L128 610" stroke="url(#armL)" stroke-width="58"/>
      <path d="M278 512 L156 590" stroke="url(#panel)" stroke-width="26"/>
      <path d="M342 500 L512 610" stroke="url(#armR)" stroke-width="58"/>
      <path d="M362 512 L484 590" stroke="url(#panel)" stroke-width="26"/>
    </g>
    <rect x="266" y="470" width="108" height="46" rx="23" fill="#111"/>

    <!-- fingers -->
    <g stroke-linecap="round" fill="none">
      <path d="M128 610 C 72 700, 82 820, 176 912" stroke="url(#armL)" stroke-width="54"/>
      <path d="M118 650 C 92 720, 100 800, 160 868" stroke="url(#panel)" stroke-width="22"/>
      <path d="M512 610 C 568 700, 558 820, 464 912" stroke="url(#armR)" stroke-width="54"/>
      <path d="M522 650 C 548 720, 540 800, 480 868" stroke="url(#panel)" stroke-width="22"/>
    </g>
    <path d="M160 898 L212 930 L196 950 L146 922 Z" fill="url(#metalV)"/>
    <path d="M480 898 L428 930 L444 950 L494 922 Z" fill="url(#metalV)"/>

    <!-- joints -->
    <g>
      <circle cx="298" cy="500" r="28" fill="url(#metal)"/>
      <circle cx="298" cy="500" r="15" fill="#151515"/>
      <circle cx="298" cy="500" r="7" fill="url(#metal)"/>
      <circle cx="342" cy="500" r="28" fill="url(#metal)"/>
      <circle cx="342" cy="500" r="15" fill="#151515"/>
      <circle cx="342" cy="500" r="7" fill="url(#metal)"/>
      <circle cx="128" cy="610" r="30" fill="url(#metal)"/>
      <circle cx="128" cy="610" r="16" fill="#151515"/>
      <circle cx="128" cy="610" r="8" fill="url(#metal)"/>
      <circle cx="512" cy="610" r="30" fill="url(#metal)"/>
      <circle cx="512" cy="610" r="16" fill="#151515"/>
      <circle cx="512" cy="610" r="8" fill="url(#metal)"/>
    </g>
  </g>
</svg>
